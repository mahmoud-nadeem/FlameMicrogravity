# Owner (Mohammed Tamer): verify every field against the PSI page, complete it, then remove these two lines.
id: PSI-159
author: tamer
summary: >
  ISS study of spherical gas flames on a porous burner (ACME hardware) that looked for cool flames
  burning at about 500-1,000 K. Normal flames sent ethane, propane or n-butane into an O2/N2
  atmosphere; inverse flames sent oxygen (up to 85%) into a fuel atmosphere. 333 tests record whether
  a hot flame ignited and whether it put itself out, including 20 ambient-atmosphere tests inside
  the expected Moon-base oxygen and pressure envelope.
fuel_type: gas
fuels: [ethane, propane, n-butane]
sample: "Porous spherical burner"
hardware_family: ACME-CIR
conditions:
  o2_percent: [12, 85]
  pressure_atm: [0.49, 3.27]
  flow_cm_s: null
  diluents: [N2]
  gravity: [microgravity]
  notes: "Ambient O2 is 18-40% in normal flames; 12-85% is the oxygen fraction of the burner stream in inverse flames."
varied:
  - fuel and its dilution
  - normal vs inverse flame
  - oxygen fraction
  - pressure
  - fuel or oxygen flow rate
constant:
  - same ACME burner hardware in the Combustion Integrated Rack
measurements:
  - three photomultiplier tubes (chemiluminescence)
  - radiometers
  - thermocouples, including burner temperature
  - ion current
  - pressure transducers and mass-flow controllers
  - intensified and colour cameras
pillars: [prevention]
tests:
  count: 333
data_readiness: per-test-time-series
modeling_targets:
  - hot ignition yes / no
  - self-extinction vs flow-terminated
  - burn time
limitations:
  - "Sensor channels look like raw voltages; physical units need the engineering documents."
  - "Labels are inconsistent (Yes / yes / flash, '-' for missing)."
  - "Only 8 tests carry an explicit cool-flame label."
sources:
  - https://psi.nasa.gov/physci/repo/data/investigations/PSI-159
  - https://doi.org/10.60555/cyt1-kh64
